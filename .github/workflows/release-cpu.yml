name: Software interface and distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  clean-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Initialize installer test sources
        run: git submodule update --init --depth 1 -- vendor/sru vendor/protein_sequence_models
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Shell completion runtime
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Non-editable installation
        id: install
        run: python -m pip install '.[dev]'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Durable recovery contract and negative controls
        run: python scripts/validation/verify_runtime_recovery.py --self-test --output "$RUNNER_TEMP/runtime-recovery"
      - name: Upload recovery verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-recovery-python-${{ matrix.python }}
          path: ${{ runner.temp }}/runtime-recovery/
          if-no-files-found: error
      - name: Installed entrypoint outside checkout
        run: |
          cd "$RUNNER_TEMP"
          astrolabe --version
          astrolabe --help
          astrolabe run --task release_protein --dry-run env=env
      - name: CPU dependencies for structural and real process tests
        id: cpu_dependencies
        run: |
          python -m pip install rdkit
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: CPU workflows and numerical regressions
        run: python scripts/validation/release_cpu.py -q
      - name: Integrated CLI, Score receipts and deterministic recovery
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.cpu_dependencies.outcome == 'success' }}
        env:
          CUDA_VISIBLE_DEVICES: ''
          JAX_PLATFORMS: cpu
          OMP_NUM_THREADS: '1'
        run: |
          python -m pytest -q tests/test_integrated_cli_workflow.py \
            tests/test_model_daemon.py::test_ready_owner_keeps_serving_after_its_startup_deadline \
            tests/test_design_native_prediction.py tests/test_design_variable_length.py \
            tests/test_protein_beam.py tests/test_protein_beam_routing.py \
            tests/test_interface_budget.py \
            --junitxml="$RUNNER_TEMP/integrated-runtime.xml"
      - name: Upload integrated runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-runtime-python-${{ matrix.python }}
          path: ${{ runner.temp }}/integrated-runtime.xml
          if-no-files-found: error
      - name: Daily configuration failures and valid CLI controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.cpu_dependencies.outcome == 'success' }}
        run: python tests/run_daily_task_cli.py --report "$RUNNER_TEMP/daily-task.json" --jobs 2
      - name: Upload daily CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-cli-python-${{ matrix.python }}
          path: ${{ runner.temp }}/daily-task*
          if-no-files-found: error
      - name: Build public distributions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python scripts/release/export.py "$RUNNER_TEMP/Astrolabe" --archive dist/astrolabe-source.tar.gz
          python -m build "$RUNNER_TEMP/Astrolabe" --outdir "$GITHUB_WORKSPACE/dist"
      - name: Upload source and Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: astrolabe-python-${{ matrix.python }}
          path: |
            dist/astrolabe-*.tar.gz
            dist/astrolabe-*.whl
          if-no-files-found: error
