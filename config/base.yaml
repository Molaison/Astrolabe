# Task defaults. Configure inputs, named components, scores and stages in your task YAML.
# Adapter defaults live in components/; host paths belong in env/.
# The only mutation count setting is stages.<stage>.mutation_num.

defaults:
- env: env
- components/evaluator
- components/mutator
- components/predocker
- components/initializer
- override hydra/hydra_logging: disabled
- override hydra/job_logging: disabled
- _self_
task_name: null
out_dir: null
# Import a verified original raw root prediction into a fresh native run.
root_prediction_receipt: null
initial_temperature: 0.05
homologies: {}
ligand_resnames: {}
dynamic_binding_site_enabled: false
use_metropolis_acceptance: false
enable_pyrosetta: false
allow_mmcif_pdb_fallback: false
per_residue_scores:
  enabled: false
  terms: {}
  mutator_score_terms: {}
  allow_missing_mutator_score_terms: false
debug: false
profiling:
  enabled: false
  # Glob patterns over names such as evaluator.*, score.*, mutate.*, runtime.*.
  modules: ["*"]
  sample_interval_s: 1.0
  gpu: false
  cprofile: false
  max_events: 200000
  # null writes a unique session below out_dir/profile.
  output_dir: null
logging:
  console_level: INFO
  info_file_level: INFO
  debug_file_level: DEBUG
  color:
    console: auto
    file: strip
    dump: strip
steps: 20
repeats: 1
seed: null
types: null
selector:
  selector_terms: {}
exclude_AA:
- C
covalent_bonds: []
aa_bias: null
named_files: null
structure_start: null
raw_model_results_dir: null
loss:
  loss_terms: {}
protein_beam:
  workers: 3
  in_flight: 3
hydra:
  run:
    dir: .
  output_subdir: null
evaluator:
  evaluator_terms: {}
mutator:
  mutator_terms: {}
