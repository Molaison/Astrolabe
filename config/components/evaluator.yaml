# @package _global_

# Adapter defaults. Task files configure named aliases; machine paths come from env.
evaluator:
  initialization:
    workers: 1
    seed: null
  scheduling:
    overlap_cpu_postprocess: false
    cpu_postprocess_workers: 1
  alphafold2:
    model_id: 3
    suffix: multimer_v3
    data_dir: ${weight_path.alphafold}
    recycles: 3
    msa_clusters: 1
    initial_guess:
      enabled: false
      path: null
      source: null
      chain_map: null
      allow_missing_chains: false
      allow_missing_residues: false
  rf3:
    repo_path: ${rf3.repo_path}
    ckpt_path: ${rf3.ckpt_path}
    python_bin: ${subprocess_envs.rf3.python_bin}
    template_selection: null
    ground_truth_conformer_selection: null
    fixed_ligands: {}
    template_noise_scale: 1.0e-05
    fallback_conformer_to_input_coords: true
    early_stopping_plddt_threshold: null
    compress_outputs: false
    recycles: 10
    samples: 5
    diffusion_steps: 50
  rhofold:
    checkpoint: ${rhofold.checkpoint}
    binary_dpath: ${rhofold.binary_dpath}
    database_dpath: ${rhofold.database_dpath}
    device: cuda
    relax_steps: 200
  alphafold3:
    service_socket: null
    num_seeds: 1
    save_embeddings: false
    model_dir: ${weight_path.alphafold3}
    flash_attention_implementation: cudnn
    run_data_pipeline: false
    run_inference: true
    jax_compilation_cache_dir: ${oc.env:JAX_COMPILATION_CACHE_DIR,"~/.cache/jax_cache"}
    bucket_size: 40
    bucket_pad_tolerance: 40
    buckets: null
    refstructure_workers: 8
    refstructure_cache: 1
    refstructure_cache_max_entries: 20000
    msa_cache: 1
    msa_cache_max_entries: 8
    datapipeline:
      jackhmmer_binary_path: ${hmmer.jackhmmer}
      nhmmer_binary_path: ${hmmer.nhmmer}
      hmmalign_binary_path: ${hmmer.hmmalign}
      hmmsearch_binary_path: ${hmmer.hmmsearch}
      hmmbuild_binary_path: ${hmmer.hmmbuild}
      db_dir: null
      small_bfd_database_path: null
      mgnify_database_path: null
      uniprot_cluster_annot_database_path: null
      uniref90_database_path: null
      ntrna_database_path: null
      rfam_database_path: null
      rna_central_database_path: null
      pdb_database_path: null
      seqres_database_path: null
      jackhmmer_n_cpu: 8
      nhmmer_n_cpu: 8
    recycles: 10
    samples: 5
  chai1:
    use_esm_embeddings: true
    recycles: 3
    diffusion_steps: 200
  boltz:
    cache: ${weight_path.boltz}
    checkpoint: null
    devices: 1
    accelerator: auto
    write_full_pae: true
    write_full_pde: false
    output_format: mmcif
    num_workers: 2
    override: false
    use_msa_server: false
    msa_server_url: null
    msa_pairing_strategy: greedy
    recycles: 3
    samples: 5
    diffusion_steps: 200
  mol1:
    python_bin: ${subprocess_envs.mol1.python_bin}
    repo_path: ${subprocess_envs.mol1.repo_path}
    extra_python_paths: ${subprocess_envs.mol1.extra_python_paths}
    mol_root_dir: ${weight_path.mol1}
    model_name: auto
    base_checkpoint_path: ${weight_path.mol1_base}
    constraint_checkpoint_path: ${weight_path.mol1_constraint}
    load_checkpoint_path: null
    dynamic_binding_site: false
    reference_assets: {}
    execution_mode: daemon
    device: auto
    num_workers: 0
    dtype: bf16
    use_msa: false
    need_atom_confidence: true
    triangle_multiplicative: auto
    triangle_attention: auto
    enable_fusion: true
    enable_tf32: false
    deterministic: false
    timeout_seconds: null
    constraints: null
    recycles: 20
    samples: 5
    diffusion_steps: 200
  opendde:
    python_bin: ${subprocess_envs.opendde.python_bin}
    repo_path: ${subprocess_envs.opendde.repo_path}
    opendde_root_dir: ${weight_path.opendde}
    model_name: opendde_v1
    load_checkpoint_path: null
    dtype: fp32
    use_msa: false
    use_template: false
    use_rna_msa: false
    need_atom_confidence: false
    triangle_multiplicative: auto
    triangle_attention: auto
    enable_cache: true
    enable_fusion: true
    enable_tf32: true
    deterministic: false
    use_tfg_guidance: false
    kalign_binary_path: null
    hmmsearch_binary_path: ${oc.select:hmmer.hmmsearch,null}
    hmmbuild_binary_path: ${oc.select:hmmer.hmmbuild,null}
    seqres_database_path: null
    nhmmer_binary_path: ${oc.select:hmmer.nhmmer,null}
    hmmalign_binary_path: ${oc.select:hmmer.hmmalign,null}
    hmmbuild_rna_binary_path: null
    ntrna_database_path: null
    rfam_database_path: null
    rna_central_database_path: null
    nhmmer_n_cpu: null
    foldcp_mode: single
    foldcp_size_dp: 1
    foldcp_size_cp: 1
    foldcp_devices: ''
    foldcp_metrics_jsonl: ''
    timeout_seconds: null
    recycles: 10
    samples: 5
    diffusion_steps: 200
  esmfold2:
    python_bin: ${subprocess_envs.esmfold2.python_bin}
    esm_repo_path: ${subprocess_envs.esmfold2.esm_repo_path}
    transformers_repo_path: ${subprocess_envs.esmfold2.transformers_repo_path}
    model_name: biohub/ESMFold2
    cache_dir: null
    device: null
    esmc_precision: bf16
    seed: null
    lm_dropout: null
    msa_max_depth: null
    msa_column_mask_rate: null
    chunk_size: 64
    local_files_only: false
    timeout_seconds: null
    recycles: 3
    samples: 1
    diffusion_steps: 50
  protenix:
    model_name: protenix-v2
    dynamic_binding_site: false
    enable_tf32: true
    enable_diffusion_shared_vars_cache: false
    enable_efficient_fusion: false
    msa_pair_as_unpair: true
    use_template: false
    use_rna_msa: false
    use_seeds_in_json: false
    triangle_multiplicative: torch
    triangle_attention: torch
    dtype: bf16
    load_checkpoint_dir: null
    load_checkpoint_path: ${weight_path.protenix}
    load_strict: true
    need_atom_confidence: false
    num_workers: 16
    seed: ${seed}
    seeds:
    - 101
    sorted_by_ranking_score: true
    use_deepspeed_evo_attention: false
    use_msa: true
    infer_setting:
      chunk_size: 64
      lddt_metrics_chunk_size: 1
      lddt_metrics_sparse_enable: true
      sample_diffusion_chunk_size: 1
    data:
      ccd_components_file: ${protenix.ccd_components_file}
      ccd_components_rdkit_mol_file: ${protenix.ccd_components_rdkit_mol_file}
      num_dl_workers: 16
      msa:
        enable: true
        enable_rna_msa: false
      template:
        enable: false
    sample_diffusion:
      guidance:
        enable: false
        log_last_step_energy: true
        rho: 0.0
        mu: 0.1
        mc:
          std: 0.0
          batch: 1
        steps:
          tfg_outer: 1
          tfg_inner: 20
          projection_outer: 2
          projection_inner: 10
        terms:
          VinaStericPotential:
            interval: 1
            weight: 0.1
            buffer: 0.225
          ExperimentalTorsionPotential:
            interval: 1
            weight: 0.0015
          InterchainBondPotential:
            interval: 1
            weight: 0.15
            buffer: 2.0
          PairwiseDistancePotential:
            interval: 1
            weight: 0.5
            enable_projection: true
            bond_buffer: 0.0
            angle_buffer: 0.0
            clash_buffer: 0.0
          ChiralAtomPotential:
            interval: 1
            weight: 0.0
            enable_projection: true
            buffer: 0.6155
          StereoBondPotential:
            interval: 1
            weight: 0.25
            buffer: 0.5236
          PlanarImproperPotential:
            interval: 1
            weight: 0.12
          LinearBondPotential:
            interval: 1
            weight: 0.25
            buffer: 0.08726646259
      gamma0: 0.8
      gamma_min: 1.0
      noise_scale_lambda: 1.003
      step_scale_eta: 1.5
    recycles: 4
    samples: 5
    diffusion_steps: 200
