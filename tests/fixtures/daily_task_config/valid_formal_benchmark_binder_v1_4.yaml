protein_beam:
  workers: 3
  in_flight: 3
repeats: 1
seqs:
  A: 80-120
  B: ACDEFGHIKLMNPQRSTVWY
stages:
  default:
    oligo:
    - A
    evaluator: Protenix
    mutators:
    - dplm
    mutation_num: 100%
    weighted_score_expression: '-0.4 * (1 / (1 + exp(-((binder_rog - globin_rog) /
      5.0)))) - min(binder_loop_frac,1) * 0.6 '
    acceptance_threshold: (binder_loop_frac < 0.4) and (binder_rog <= globin_rog +
      3)
    early_stopping: null
  ligand:
    _entrance: (binder_loop_frac < 0.4) and (binder_rog <= globin_rog + 3)
    oligo:
    - AB
    evaluator: Protenix
    mutation_num: 100%
    acceptance_threshold: null
    mutators:
    - LigandMPNN_itf
    - LigandMPNN_noitf
    mutator_weights:
    - 1.0
    - 1.0
    weighted_score_expression: iptm - 0.3 * (1 / (1 + exp(-((binder_rog - globin_rog)
      / 5.0)))) - min(binder_loop_frac,1) * 0.6
