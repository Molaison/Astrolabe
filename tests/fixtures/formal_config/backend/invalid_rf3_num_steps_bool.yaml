# Standalone startup-only fixture; no model is loaded.
# config/base.yaml is an existing file placeholder for path-stat checks, not weights.
task_name: backend_formal_fixture
out_dir: /tmp/astrolabe-backend-formal-fixture
steps: 1
seed: 17
types:
  A: p
seqs:
  A: AAAA
enable_pyrosetta: false
skip_complex_poses: true
evaluator:
  evaluator_terms:
    backend:
      _type: rf3
      repo_path: .
      ckpt_path: downloadable_model_name
      python_bin: /usr/bin/true
      n_recycles: 0
      diffusion_batch_size: 1
      num_steps: true
      template_noise_scale: 0.0
      fallback_conformer_to_input_coords: null
      early_stopping_plddt_threshold: null
      compress_outputs: false
mutator:
  mutator_terms:
    mcmc:
      _type: mcmc
      mutation_method: frequency_adjusted
      select_positions: random
loss:
  loss_terms: {}
stages:
  default:
    evaluator: backend
    oligo:
    - A
    mutators:
    - mcmc
    mutation_num: 1
    weighted_score_expression: '0'
    acceptance_threshold: null
    early_stopping: null
