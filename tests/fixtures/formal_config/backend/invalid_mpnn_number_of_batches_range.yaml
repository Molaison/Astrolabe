# Standalone startup-only fixture; no model is loaded.
# config/base.yaml is an existing file placeholder for path-stat checks, not weights.
task_name: backend_formal_fixture
out_dir: /tmp/astrolabe-backend-formal-fixture
steps: 1
seed: 17
types:
  A: p
seqs:
  A: AAAA
enable_pyrosetta: false
skip_complex_poses: true
evaluator:
  evaluator_terms:
    backend:
      _type: sequence
mutator:
  mutator_terms:
    mcmc:
      _type: mcmc
      mutation_method: frequency_adjusted
      select_positions: random
    candidate:
      _type: ligandmpnn
      model_type: protein_mpnn
      checkpoint_protein_mpnn: config/base.yaml
      temperature: 0.3
      number_of_batches: 0
      seed: null
      ligand_mpnn_cutoff_for_score: 8.0
      bias_mode: additive
loss:
  loss_terms: {}
stages:
  default:
    evaluator: backend
    oligo:
    - A
    mutators:
    - mcmc
    - candidate
    mutation_num: 1
    weighted_score_expression: '0'
    acceptance_threshold: null
    early_stopping: null
