# Standalone startup-only fixture; no model is loaded.
# config/base.yaml is an existing file placeholder for path-stat checks, not weights.
task_name: backend_formal_fixture
out_dir: /tmp/astrolabe-backend-formal-fixture
steps: 1
seed: 17
types:
  A: p
seqs:
  A: AAAA
enable_pyrosetta: false
skip_complex_poses: true
evaluator:
  evaluator_terms:
    backend:
      _type: chai1
      use_esm_embeddings: true
      num_trunk_recycles: 0
      num_diffn_timesteps: null
      num_diffn_samples: 1
      num_trunk_samples: 1
      recycle_msa_subsample: 0
      seed: null
      low_memory: true
      use_msa_server: false
mutator:
  mutator_terms:
    mcmc:
      _type: mcmc
      mutation_method: frequency_adjusted
      select_positions: random
loss:
  loss_terms: {}
stages:
  default:
    evaluator: backend
    oligo:
    - A
    mutators:
    - mcmc
    mutation_num: 1
    weighted_score_expression: '0'
    acceptance_threshold: null
    early_stopping: null
